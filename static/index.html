<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;

            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 24px;
            background: #222;
            border-bottom: 1px solid #333;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        header p {
            margin: 5px 0 0;
            color: #aaa;
            font-size: 14px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 800px;
            padding: 12px 16px;
            border-radius: 12px;

            white-space: pre-wrap;
            line-height: 1.5;
        }

        .user {
            align-self: flex-end;
            background: #3b82f6;
        }

        .bot {
            align-self: flex-start;
            background: #292929;
        }

        #input-area {
            padding: 15px;
            background: #222;
            border-top: 1px solid #333;

            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;

            resize: none;

            border: 1px solid #444;
            border-radius: 10px;

            background: #151515;
            color: white;

            padding: 12px;

            font-size: 15px;
            outline: none;
        }

        #message:focus {
            border-color: #666;
        }

        #send {
            border: none;
            border-radius: 10px;

            padding: 0 20px;

            background: #3b82f6;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        #send:hover {
            background: #2563eb;
        }

        #send:disabled {
            background: #555;
            cursor: not-allowed;
        }

    </style>
</head>

<body>

    <header>

        <h1>My AI Chatbot</h1>

        <p>Chat with my AI!</p>

    </header>


    <main id="chat"></main>


    <div id="input-area">

        <textarea
            id="message"
            rows="1"
            placeholder="Message..."
        ></textarea>

        <button id="send">
            Send
        </button>

    </div>


    <script>

        let sessionId = null;


        const chat = document.getElementById("chat");
        const input = document.getElementById("message");
        const sendButton = document.getElementById("send");


        // =========================
        // Create chatbot session
        // =========================

        async function createSession() {

            const response = await fetch("/session", {
                method: "POST"
            });

            const data = await response.json();

            sessionId = data.session_id;
        }


        // =========================
        // Add message to UI
        // =========================

        function addMessage(text, type) {

            const message = document.createElement("div");

            message.classList.add("message");
            message.classList.add(type);

            message.textContent = text;

            chat.appendChild(message);

            chat.scrollTop = chat.scrollHeight;

            return message;
        }


        // =========================
        // Send message
        // =========================

        async function sendMessage() {

            const message = input.value.trim();

            if (!message || !sessionId) {
                return;
            }


            input.value = "";

            sendButton.disabled = true;


            // User message

            addMessage(message, "user");


            // Empty bot message

            const botMessage = addMessage("", "bot");


            try {

                const response = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        session_id: sessionId,
                        message: message
                    })

                });


                if (!response.ok) {
                    throw new Error("Server error");
                }


                // Read streamed response

                const reader = response.body.getReader();

                const decoder = new TextDecoder();

                let fullResponse = "";


                while (true) {

                    const { value, done } = await reader.read();

                    if (done) {
                        break;
                    }


                    const chunk = decoder.decode(value);

                    fullResponse += chunk;

                    botMessage.textContent = fullResponse;

                    chat.scrollTop = chat.scrollHeight;
                }


            } catch (error) {

                botMessage.textContent =
                    "Sorry, something went wrong.";

                console.error(error);

            }


            sendButton.disabled = false;

            input.focus();
        }


        // =========================
        // Button
        // =========================

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // =========================
        // Enter to send
        // Shift+Enter = new line
        // =========================

        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();
                }

            }
        );


        // =========================
        // Start session
        // =========================

        createSession();

    </script>

</body>

</html>
